<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Лесное озеро — Кастинг</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s, color 0.2s, border-color 0.2s;
        }

        :root, body.light {
            --bg-body: #f8fafc;
            --bg-header: #ffffff;
            --card-bg: #ffffff;
            --approved-card-bg: #ecfdf5;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --approved: #10b981;
            --approved-bg: #d1fae5;
            --approved-border: #a7f3d0;
            --chip-bg: #f1f5f9;
            --modal-bg: rgba(0,0,0,0.5);
            --date-badge: #e0e7ff;
            --date-text: #4338ca;
            --scene-bg: #faf9f5;
            --scene-border: #e2e0d4;
            --scene-text: #1a1a1a;
            --scene-dialogue-bg: #f5f3ee;
        }

        body.dark {
            --bg-body: #0a0c10;
            --bg-header: #11151c;
            --card-bg: #161c27;
            --approved-card-bg: #1a2e28;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #2d3a4e;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.5);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.6);
            --accent: #60a5fa;
            --accent-hover: #93c5fd;
            --approved: #34d399;
            --approved-bg: #1f3a2f;
            --approved-border: #2d5a4a;
            --chip-bg: #1e2a3a;
            --modal-bg: rgba(0,0,0,0.7);
            --date-badge: #1e2a3a;
            --date-text: #a5b4fc;
            --scene-bg: #1a1c20;
            --scene-border: #2a2c30;
            --scene-text: #e2e2e2;
            --scene-dialogue-bg: #25282e;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
        }

        .header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-light);
            padding: 1.25rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }
        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .theme-toggle {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            background-color: var(--accent);
            color: white;
        }

        .main-content {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .approved-section {
            background: var(--approved-card-bg);
            border: 1px solid var(--approved-border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .approved-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .approved-title {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--approved);
        }
        .approved-toggle-icon {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .approved-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            margin-top: 0;
        }
        .approved-list.expanded {
            max-height: 800px;
            margin-top: 1rem;
        }
        .approved-item {
            display: flex;
            gap: 1.2rem;
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border: 1px solid var(--border-light);
            transition: all 0.2s;
        }
        .approved-item:hover {
            transform: translateX(4px);
            border-color: var(--approved);
        }
        .approved-photo {
            flex-shrink: 0;
        }
        .approved-photo img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 0.75rem;
            cursor: pointer;
            border: 2px solid var(--approved);
        }
        .approved-photo-placeholder {
            width: 100px;
            height: 100px;
            background: var(--approved);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: 700;
        }
        .approved-info {
            flex: 1;
        }
        .approved-role {
            display: inline-block;
            background: var(--approved-bg);
            color: var(--approved);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            margin-bottom: 0.5rem;
        }
        .approved-actor-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }
        .approved-details {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .approved-contact-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
        }
        .approved-contact-btn:hover {
            background: var(--accent-hover);
        }
        .empty-approved {
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 0.5rem 0;
        }

        .series-section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-secondary);
        }
        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
        }
        .series-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .card-header {
            padding: 1rem 1.5rem 0.5rem;
            border-bottom: 1px solid var(--border-light);
        }
        .series-number {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .badge-count {
            font-size: 0.75rem;
            background: var(--chip-bg);
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
        }
        .characters-list {
            padding: 1rem 1.5rem 1.5rem;
        }
        .character-items {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            list-style: none;
        }
        .character-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--chip-bg);
            padding: 0.6rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .character-item:hover {
            border-color: var(--accent);
            background: var(--card-bg);
            transform: translateX(4px);
        }
        .character-name {
            font-weight: 600;
        }
        .character-dates {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .date-badge {
            font-size: 0.7rem;
            background: var(--date-badge);
            color: var(--date-text);
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-weight: normal;
        }
        .empty-message {
            color: var(--text-muted);
            padding: 0.5rem;
            text-align: center;
            background: var(--chip-bg);
            border-radius: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }
        .modal-container {
            background: var(--card-bg);
            border-radius: 2rem;
            max-width: 800px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-muted);
            z-index: 10;
        }
        .modal-close:hover { color: var(--accent); }
        .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--accent);
        }
        .modal-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-light);
        }

        .scene-block {
            background: var(--scene-bg);
            border: 1px solid var(--scene-border);
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .scene-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            cursor: pointer;
            background: var(--scene-bg);
            transition: background 0.2s;
        }
        .scene-header:hover {
            background: var(--chip-bg);
        }
        .scene-title {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .scene-flag {
            font-size: 1rem;
        }
        .toggle-scene-btn {
            background: none;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.2rem 0.5rem;
            font-family: monospace;
            border-radius: 20px;
        }
        .toggle-scene-btn:hover {
            background: var(--accent);
            color: white;
        }
        .scene-content {
            font-family: 'Courier New', 'Fira Code', 'Source Code Pro', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--scene-text);
            padding: 0 1rem 1rem 1rem;
            border-top: 1px solid var(--scene-border);
            display: none;
        }
        .scene-content.expanded {
            display: block;
        }
        .scene-action {
            margin: 0.8rem 0;
            font-style: normal;
            color: var(--text-secondary);
        }
        .scene-parenthetical {
            margin: 0.2rem 0 0.2rem 1.5rem;
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .scene-dialogue {
            margin: 0.4rem 0;
            padding-left: 2rem;
            background: var(--scene-dialogue-bg);
            border-radius: 0.5rem;
            padding: 0.3rem 1rem;
        }
        .scene-character {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
            color: var(--accent);
        }
        .scene-lines {
            margin-left: 1rem;
            font-size: 0.85rem;
        }
        .go-to-probes-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.75rem;
            margin-top: 0.75rem;
            font-family: system-ui;
        }

        .probes-section {
            margin-top: 0.5rem;
        }
        .probes-title {
            font-weight: 600;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }
        .probes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.2rem;
        }
        .probe-card {
            background: var(--chip-bg);
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            border: 1px solid var(--border-light);
            transition: all 0.2s;
        }
        .probe-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            border-color: var(--accent);
        }
        .probe-card.approved-card {
            border: 2px solid var(--approved);
            background: var(--approved-bg);
        }
        .approved-tag {
            background: var(--approved);
            color: #064e3b;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            display: inline-block;
            margin-left: 0.5rem;
        }
        body.dark .approved-tag {
            color: #6ee7b7;
        }
        .probe-photo {
            margin-bottom: 0.75rem;
        }
        .probe-photo img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 0.75rem;
            cursor: pointer;
            border: 2px solid var(--accent);
            background: var(--card-bg);
        }
        .probe-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }
        .probe-details {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }
        .probe-desc {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }
        .probe-film-link {
            display: inline-block;
            background: var(--chip-bg);
            color: var(--accent);
            border: 1px solid var(--border-light);
            padding: 0.3rem 0.6rem;
            border-radius: 40px;
            font-size: 0.7rem;
            text-decoration: none;
            margin-bottom: 0.5rem;
        }
        .probe-film-link:hover {
            background: var(--accent);
            color: white;
        }
        .watch-video-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.75rem;
            width: 100%;
        }
        .watch-video-btn:hover {
            background: var(--accent-hover);
        }
        .empty-probes {
            color: var(--text-muted);
            padding: 1rem;
            text-align: center;
            background: var(--chip-bg);
            border-radius: 1rem;
        }

        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            z-index: 1200;
        }
        .video-modal.active { display: flex; }
        .video-container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            background: black;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .video-responsive {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-responsive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            color: white;
            border: none;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            z-index: 20;
        }

        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            z-index: 1300;
            cursor: pointer;
        }
        .image-modal.active { display: flex; }
        .image-modal img { max-width: 90%; max-height: 90%; border-radius: 1rem; }
        .close-image {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-light);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (min-width: 641px) {
            .approved-item {
                flex-direction: row;
                align-items: flex-start;
            }
            .approved-photo img {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 640px) {
            .series-grid { gap: 1rem; }
            .probes-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .modal-title { font-size: 1.3rem; }
            .approved-item {
                flex-direction: row !important;
                align-items: center !important;
                text-align: left !important;
                gap: 0.8rem;
                padding: 0.8rem;
            }
            .approved-info {
                text-align: left !important;
            }
            .approved-photo img {
                width: 65px;
                height: 65px;
            }
            .approved-photo-placeholder {
                width: 65px;
                height: 65px;
                font-size: 1.5rem;
            }
            .approved-actor-name {
                font-size: 0.95rem;
                margin-bottom: 0.1rem;
            }
            .approved-details {
                font-size: 0.7rem;
                margin-bottom: 0.3rem;
            }
            .approved-contact-btn {
                font-size: 0.65rem;
                padding: 0.2rem 0.6rem;
            }
            .approved-role {
                font-size: 0.6rem;
                margin-bottom: 0.3rem;
            }
            .approved-list.expanded {
                max-height: 600px;
            }
            .character-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .probe-card { flex-wrap: wrap; }
        }
    </style>
</head>
<body class="light">
    <header class="header">
        <div class="header-container">
            <div class="title-section">
                <h1>🌲 Лесное озеро</h1>
            </div>
            <button class="theme-toggle" id="themeSwitcher">
                <span id="themeIcon">🌞</span> <span id="themeText">Светлая тема</span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="approved-section" id="approvedSection">
            <div class="approved-header" id="approvedHeader">
                <div class="approved-title">✅ Утверждённые</div>
                <span class="approved-toggle-icon" id="approvedToggleIcon">▼</span>
            </div>
            <div class="approved-list" id="approvedList">
                <div id="approvedListContainer"></div>
            </div>
        </div>

        <div class="series-section-title">📺 По сериям</div>
        <div id="seriesContainer"></div>
    </main>

    <footer class="footer">
        <p>🎬 Нажми на персонажа → раскрой сцену (📖) → пробы</p>
    </footer>

    <div id="probeModal" class="modal">
        <div class="modal-container">
            <span class="modal-close" id="closeProbeModal">×</span>
            <div id="modalDynamicContent"></div>
        </div>
    </div>
    <div id="imageModal" class="image-modal">
        <button class="close-image" id="closeImageBtn">✕</button>
        <img id="fullscreenImage" src="" alt="Увеличенное фото">
    </div>
    <div id="videoModal" class="video-modal">
        <div class="video-container">
            <button class="video-close-btn" id="closeVideoBtn">✕ Закрыть</button>
            <div class="video-responsive" id="videoIframeContainer"></div>
        </div>
    </div>

    <script>
        const APPROVED_ACTORS = [
            {

            },
            {

            }
        ];

        const CHARACTERS_DB = {

                probes: [],
                scene: {

                }
            },
            "Врач 4": {
                series: 4,
                dates: ["04.07"],
                approvedProbeId: null,
                probes: [],
                scene: {
                    title: "4-28. БОЛЬНИЦА. РЕАНИМАЦИОННЫЙ БЛОК АНИ",
                    content: `<div class="scene-action">Настя и Данила стоят в коридоре, смотрят на Аню. Приходит врач.</div>
<div class="scene-dialogue"><div class="scene-character">ВРАЧ</div><div class="scene-lines">Страховы?</div></div>
<div class="scene-dialogue"><div class="scene-character">ДАНИЛА</div><div class="scene-lines">Да, это мы!</div></div>
<div class="scene-dialogue"><div class="scene-character">ВРАЧ</div><div class="scene-lines">Стабилизировали. Но в лёгких могла остаться вода. Девочку оставляем под наблюдением.</div></div>
<div class="scene-dialogue"><div class="scene-character">ДАНИЛА</div><div class="scene-lines">Мы останемся с ней!</div></div>
<div class="scene-dialogue"><div class="scene-character">ВРАЧ</div><div class="scene-lines">Возвращайтесь утром, мамам и папам тоже нужно отдохнуть.</div></div>
<div class="scene-action">Настя и Данила переглядываются. Настю колотит. Данила обнимает её.</div>`
                }
            },
            "Врач скорой": {
                series: 4,
                dates: ["14.07"],
                approvedProbeId: null,
                probes: [],
                scene: {
                    title: "4-24. БЕРЕГ ОЗЕРА. ДЕНЬ 12",
                    content: `<div class="scene-action">На берегу стоит машина скорой. Анечка жива, отплёвывает воду. Врачи скорой оказывают помощь.</div>
<div class="scene-action">Сотрудники скорой поднимают Аню, заносят в скорую.</div>
<div class="scene-dialogue"><div class="scene-character">ВРАЧ</div><div class="scene-lines">Родители, вы нам мешаете! Здесь места нет! Вы следом поезжайте. В детскую краевую везём.</div></div>
<div class="scene-action">Двери закрываются. Машина скорой уезжает с мигалкой.</div>`
                }
            }
        };

        let isApprovedExpanded = false;

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatPhoneForLink(phone) {
            return phone.replace(/[^0-9+]/g, '');
        }

        function renderApprovedActors() {
            const container = document.getElementById('approvedListContainer');
            if (APPROVED_ACTORS.length === 0) {
                container.innerHTML = '<div class="empty-approved">✨ Пока нет утверждённых актёров</div>';
                return;
            }
            
            let html = '';
            for (const actor of APPROVED_ACTORS) {
                const photoPath = actor.photo;
                
                html += `
                    <div class="approved-item" data-id="${actor.id}">
                        <div class="approved-photo">
                            <img src="${photoPath}" alt="${actor.name}" data-photo="${photoPath}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="approved-photo-placeholder" style="display: none;">${actor.name.charAt(0)}</div>
                        </div>
                        <div class="approved-info">
                            <div class="approved-role">${escapeHtml(actor.role)}</div>
                            <div class="approved-actor-name">${escapeHtml(actor.name)}</div>
                            <div class="approved-details">${escapeHtml(actor.age)} • ${escapeHtml(actor.details)}</div>`;
                
                for (const contact of actor.contacts) {
                    if (contact.type === 'phone') {
                        const cleanPhone = formatPhoneForLink(contact.value);
                        html += `<a href="tel:${cleanPhone}" class="approved-contact-btn">📞 ${contact.value}</a>`;
                    }
                }
                
                html += `</div></div>`;
            }
            container.innerHTML = html;
            
            document.querySelectorAll('.approved-photo img').forEach(img => {
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const photoUrl = img.getAttribute('data-photo');
                    if (photoUrl) openImageModal(photoUrl);
                });
            });
        }

        document.getElementById('approvedHeader').addEventListener('click', () => {
            const list = document.getElementById('approvedList');
            const icon = document.getElementById('approvedToggleIcon');
            if (isApprovedExpanded) {
                list.classList.remove('expanded');
                icon.textContent = '▼';
                isApprovedExpanded = false;
            } else {
                list.classList.add('expanded');
                icon.textContent = '▲';
                isApprovedExpanded = true;
            }
        });

        function getCharactersBySeries(seriesNum) {
            const result = [];
            for (const [charName, charData] of Object.entries(CHARACTERS_DB)) {
                if (charData.series === seriesNum) {
                    result.push({ name: charName, dates: charData.dates });
                }
            }
            return result;
        }

        function renderSceneHTML(scene) {
            if (!scene || !scene.content) return '';
            return `
                <div class="scene-block">
                    <div class="scene-header" onclick="toggleScene(this)">
                        <div class="scene-title">
                            <span class="scene-flag">📖</span>
                            <span>${escapeHtml(scene.title)}</span>
                        </div>
                        <button class="toggle-scene-btn">▶ Развернуть</button>
                    </div>
                    <div class="scene-content">${scene.content}</div>
                    <div style="padding: 0 1rem 1rem 1rem; display: none;" class="scene-probes-btn">
                        <button class="go-to-probes-btn" onclick="scrollToProbes()">🎬 Перейти к пробам ↓</button>
                    </div>
                </div>
            `;
        }

        function renderSeries() {
            const container = document.getElementById('seriesContainer');
            let html = `<div class="series-grid">`;
            for (let s = 1; s <= 4; s++) {
                const chars = getCharactersBySeries(s);
                html += `<div class="series-card"><div class="card-header">
                            <div class="series-number">🎞️ Серия ${s}<span class="badge-count">${chars.length} перс.</span></div>
                         </div><div class="characters-list"><div class="character-items">`;
                if (chars.length === 0) {
                    html += `<div class="empty-message">✨ Персонажи скоро появятся</div>`;
                } else {
                    for (const ch of chars) {
                        const datesHtml = ch.dates.length > 0 ? `<div class="character-dates">${ch.dates.map(d => `<span class="date-badge">📅 ${d}</span>`).join('')}</div>` : '';
                        html += `<li class="character-item" data-char="${escapeHtml(ch.name)}">
                                    <div class="character-name">${escapeHtml(ch.name)}</div>${datesHtml}
                                 </li>`;
                    }
                }
                html += `</div></div></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
            document.querySelectorAll('.character-item').forEach(el => {
                el.addEventListener('click', () => openCharacterModal(el.getAttribute('data-char')));
            });
        }

        function openCharacterModal(characterName) {
            const modal = document.getElementById('probeModal');
            const modalContent = document.getElementById('modalDynamicContent');
            const charData = CHARACTERS_DB[characterName];
            
            const sceneHtml = charData.scene ? renderSceneHTML(charData.scene) : '';
            
            let probesHtml = '<div class="probes-section"><div class="probes-title">🎭 Пробы</div>';
            if (!charData.probes || charData.probes.length === 0) {
                probesHtml += '<div class="empty-probes">📹 Пробы для этого персонажа скоро появятся.</div>';
            } else {
                probesHtml += '<div class="probes-grid">';
                for (let idx = 0; idx < charData.probes.length; idx++) {
                    const probe = charData.probes[idx];
                    const photoPath = probe.photo && probe.photo.trim() !== "" ? probe.photo : "https://via.placeholder.com/300x300?text=Нет+фото";
                    const isApproved = charData.approvedProbeId === probe.id;
                    const approvedMark = isApproved ? '<span class="approved-tag">✅ Утверждён</span>' : '';
                    const filmLinkHtml = probe.filmLink ? `<a href="${escapeHtml(probe.filmLink)}" target="_blank" class="probe-film-link">🎬 Фильмография</a>` : '';
                    probesHtml += `
                        <div class="probe-card ${isApproved ? 'approved-card' : ''}">
                            <div class="probe-photo">
                                <img src="${escapeHtml(photoPath)}" alt="${escapeHtml(probe.name)}" class="probe-img" data-photo="${escapeHtml(photoPath)}">
                            </div>
                            <div class="probe-name">${escapeHtml(probe.name)} ${approvedMark}</div>
                            ${probe.age ? `<div class="probe-details">${escapeHtml(probe.age)}</div>` : ''}
                            ${probe.details ? `<div class="probe-details">${escapeHtml(probe.details)}</div>` : ''}
                            ${probe.extra ? `<div class="probe-desc">${escapeHtml(probe.extra)}</div>` : ''}
                            ${filmLinkHtml}
                            <button class="watch-video-btn" data-video="${escapeHtml(probe.videoUrl || '')}">🎥 Смотреть пробу</button>
                        </div>
                    `;
                }
                probesHtml += '</div>';
            }
            probesHtml += '</div>';
            
            modalContent.innerHTML = `
                <div class="modal-title">🎭 ${escapeHtml(characterName)}</div>
                <div class="modal-subtitle">${charData.dates.length > 0 ? `📅 Даты съёмок: ${charData.dates.join(', ')}` : '📅 Даты съёмок пока не указаны'}</div>
                ${sceneHtml}
                ${probesHtml}
            `;
            
            modal.classList.add('active');
            
            setTimeout(() => {
                const goToProbesBtn = document.querySelector('#modalDynamicContent .go-to-probes-btn');
                if (goToProbesBtn) goToProbesBtn.onclick = () => scrollToProbes();
            }, 50);
            
            document.querySelectorAll('.probe-img').forEach(img => {
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const photoUrl = img.getAttribute('data-photo');
                    if (photoUrl) openImageModal(photoUrl);
                });
            });
            document.querySelectorAll('.watch-video-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const videoUrl = btn.getAttribute('data-video');
                    if (videoUrl && videoUrl.trim()) {
                        openVideoModal(videoUrl);
                    } else {
                        alert('Ссылка на видео отсутствует');
                    }
                });
            });
        }

        function openVideoModal(videoUrl) {
            const modal = document.getElementById('videoModal');
            const container = document.getElementById('videoIframeContainer');
            let embedUrl = videoUrl;
            if (videoUrl.includes('vkvideo.ru')) {
                embedUrl = videoUrl;
            } else if (videoUrl.includes('yandex.net')) {
                embedUrl = videoUrl;
            } else if (videoUrl.includes('youtu.be') || videoUrl.includes('youtube.com')) {
                if (videoUrl.includes('watch?v=')) {
                    embedUrl = videoUrl.replace('watch?v=', 'embed/');
                } else if (videoUrl.includes('youtu.be/')) {
                    const videoId = videoUrl.split('/').pop();
                    embedUrl = `https://www.youtube.com/embed/${videoId}`;
                } else {
                    embedUrl = videoUrl;
                }
            }
            container.innerHTML = `<iframe src="${embedUrl}" frameborder="0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" allowfullscreen></iframe>`;
            modal.classList.add('active');
        }

        window.toggleScene = function(headerElement) {
            const sceneBlock = headerElement.closest('.scene-block');
            const content = sceneBlock.querySelector('.scene-content');
            const btn = sceneBlock.querySelector('.toggle-scene-btn');
            const probesBtnDiv = sceneBlock.querySelector('.scene-probes-btn');
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                btn.textContent = '▶ Развернуть';
                if (probesBtnDiv) probesBtnDiv.style.display = 'none';
            } else {
                content.classList.add('expanded');
                btn.textContent = '▼ Свернуть';
                if (probesBtnDiv) probesBtnDiv.style.display = 'block';
            }
        };

        window.scrollToProbes = function() {
            const probesSection = document.querySelector('#modalDynamicContent .probes-section');
            if (probesSection) probesSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        function openImageModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const fullImg = document.getElementById('fullscreenImage');
            fullImg.src = imgSrc;
            modal.classList.add('active');
        }

        document.getElementById('closeProbeModal').addEventListener('click', () => {
            document.getElementById('probeModal').classList.remove('active');
        });
        document.getElementById('closeImageBtn').addEventListener('click', () => {
            document.getElementById('imageModal').classList.remove('active');
        });
        document.getElementById('closeVideoBtn').addEventListener('click', () => {
            document.getElementById('videoModal').classList.remove('active');
            document.getElementById('videoIframeContainer').innerHTML = '';
        });
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('imageModal')) document.getElementById('imageModal').classList.remove('active');
            if (e.target === document.getElementById('videoModal')) {
                document.getElementById('videoModal').classList.remove('active');
                document.getElementById('videoIframeContainer').innerHTML = '';
            }
            if (e.target === document.getElementById('probeModal')) document.getElementById('probeModal').classList.remove('active');
        });

        const themeSwitcher = document.getElementById('themeSwitcher');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        function setTheme(theme) {
            document.body.classList.remove('light', 'dark');
            document.body.classList.add(theme);
            themeIcon.textContent = theme === 'light' ? '🌞' : '🌙';
            themeText.textContent = theme === 'light' ? 'Светлая тема' : 'Тёмная тема';
            localStorage.setItem('theme', theme);
        }
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme && (savedTheme === 'light' || savedTheme === 'dark')) setTheme(savedTheme);
        else setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        themeSwitcher.addEventListener('click', () => {
            setTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
        });

        function init() {
            renderApprovedActors();
            renderSeries();
        }
        init();
    </script>
</body>
</html>
