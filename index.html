<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Лесное озеро — Кастинг</title>
    <style>
        /* --- Стили и темы (светлая/тёмная) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s, color 0.2s, border-color 0.2s;
        }

        /* Светлая тема (по умолчанию) */
        :root, body.light {
            --bg-body: #f8fafc;
            --bg-header: #ffffff;
            --card-bg: #ffffff;
            --approved-card-bg: #ecfdf5;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --approved: #10b981;
            --approved-bg: #d1fae5;
            --approved-border: #a7f3d0;
            --chip-bg: #f1f5f9;
            --modal-bg: rgba(0,0,0,0.5);
        }

        /* Тёмная тема */
        body.dark {
            --bg-body: #0a0c10;
            --bg-header: #11151c;
            --card-bg: #161c27;
            --approved-card-bg: #1a2e28;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #2d3a4e;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.5);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.6);
            --accent: #60a5fa;
            --accent-hover: #93c5fd;
            --approved: #34d399;
            --approved-bg: #1f3a2f;
            --approved-border: #2d5a4a;
            --chip-bg: #1e2a3a;
            --modal-bg: rgba(0,0,0,0.7);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
        }

        /* --- Хедер и переключатель тем --- */
        .header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-light);
            padding: 1.25rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }
        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .theme-toggle {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            background-color: var(--accent);
            color: white;
        }

        /* --- Основной контент --- */
        .main-content {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* --- Блок утверждённых --- */
        .approved-section {
            background: var(--approved-card-bg);
            border: 1px solid var(--approved-border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .approved-title {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: var(--approved);
        }
        .approved-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .approved-item {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 0.75rem 1.25rem;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            border: 1px solid var(--border-light);
            transition: all 0.2s;
        }
        .approved-item:hover {
            border-color: var(--approved);
            transform: scale(1.02);
        }
        .approved-char-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .approved-actor-name {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .approved-badge-icon {
            background: var(--approved);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .empty-approved {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- Сетка серий --- */
        .series-section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-secondary);
        }
        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
        }
        .series-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .card-header {
            padding: 1rem 1.5rem 0.5rem;
            border-bottom: 1px solid var(--border-light);
        }
        .series-number {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .badge-count {
            font-size: 0.75rem;
            background: var(--chip-bg);
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
        }
        .characters-list {
            padding: 1rem 1.5rem 1.5rem;
        }
        .character-items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            list-style: none;
        }
        .character-item {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--chip-bg);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .character-item:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.02);
        }
        .has-approved-badge {
            background-color: var(--approved-bg);
            color: var(--approved);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 30px;
        }
        .empty-message {
            color: var(--text-muted);
            padding: 0.5rem;
            text-align: center;
            background: var(--chip-bg);
            border-radius: 1rem;
        }

        /* --- Модальные окна для проб --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }
        .modal-container {
            background: var(--card-bg);
            border-radius: 2rem;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-muted);
        }
        .modal-close:hover { color: var(--accent); }
        .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: var(--accent);
        }

        /* Карточка пробы */
        .probe-card {
            background: var(--chip-bg);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            flex-wrap: nowrap;
            border-left: 4px solid transparent;
        }
        .probe-card.approved-card {
            border-left-color: var(--approved);
            background: var(--approved-bg);
        }
        .approved-tag {
            background: var(--approved);
            color: #064e3b;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-block;
            margin-left: 0.5rem;
        }
        body.dark .approved-tag {
            color: #6ee7b7;
        }
        .probe-photo img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--accent);
        }
        .probe-info { flex: 1; min-width: 0; }
        .probe-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.2rem; }
        .probe-details { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
        .probe-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.6rem; }
        .watch-video-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .watch-video-btn:hover { background: var(--accent-hover); }

        /* Модалка для фото */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            z-index: 1300;
            cursor: pointer;
        }
        .image-modal.active { display: flex; }
        .image-modal img { max-width: 90%; max-height: 90%; border-radius: 1rem; }
        .close-image {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* Модалка для видео */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            z-index: 1200;
        }
        .video-modal.active { display: flex; }
        .video-container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            background: black;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .video-responsive {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-responsive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            color: white;
            border: none;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            z-index: 20;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-light);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Адаптивность */
        @media (max-width: 640px) {
            .series-grid { gap: 1rem; }
            .probe-photo img { width: 70px; height: 70px; }
            .modal-title { font-size: 1.3rem; }
            .approved-item { width: 100%; }
        }
        @media (max-width: 480px) {
            .probe-photo img { width: 60px; height: 60px; }
        }
    </style>
</head>
<body class="light">
    <header class="header">
        <div class="header-container">
            <div class="title-section">
                <h1>🌲 Лесное озеро</h1>
            </div>
            <button class="theme-toggle" id="themeSwitcher">
                <span id="themeIcon">🌞</span> <span id="themeText">Светлая тема</span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <!-- Отдельный блок утверждённых кастингов -->
        <div class="approved-section" id="approvedSection">
            <div class="approved-title">
                ✅ Утверждённые
            </div>
            <div id="approvedListContainer"></div>
        </div>

        <!-- Серии -->
        <div class="series-section-title">📺 По сериям</div>
        <div id="seriesContainer"></div>
    </main>

    <footer class="footer">
        <p>🎬 Нажми на имя персонажа, чтобы посмотреть все пробы</p>
    </footer>

    <!-- Модальные окна -->
    <div id="probeModal" class="modal">
        <div class="modal-container">
            <span class="modal-close" id="closeProbeModal">×</span>
            <div class="modal-title" id="modalCharTitle">Персонаж</div>
            <div id="probesListContainer"></div>
        </div>
    </div>
    <div id="imageModal" class="image-modal">
        <button class="close-image" id="closeImageBtn">✕</button>
        <img id="fullscreenImage" src="" alt="Увеличенное фото">
    </div>
    <div id="videoModal" class="video-modal">
        <div class="video-container">
            <button class="video-close-btn" id="closeVideoBtn">✕ Закрыть</button>
            <div class="video-responsive" id="videoIframeContainer"></div>
        </div>
    </div>

    <script>
        // ======================= ДАННЫЕ =======================
        // Структура для персонажа:
        // "Имя персонажа": {
        //     approvedProbeId: "id_утвержденной_пробы", // или индекс пробы (0,1,2...)
        //     series: 1, // номер серии, к которой относится персонаж
        //     probes: [
        //         { id: "uniq1", name: "Анна Иванова", photo: "url", details: "25 лет", extra: "", videoUrl: "ссылка" },
        //         ...
        //     ]
        // }
        const PROBES_DB = {};

        // ======================= ДАННЫЕ СЕРИЙ =======================
        // Автоматически строятся из PROBES_DB, но можно оставить для ручного управления
        // Пока пустые массивы, будут заполняться автоматически при добавлении персонажей
        let SERIES_DATA = [
            { number: 1, characters: [] },
            { number: 2, characters: [] },
            { number: 3, characters: [] },
            { number: 4, characters: [] }
        ];

        // ======================= ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =======================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Получить ID утверждённой пробы для персонажа
        function getApprovedProbeId(characterName) {
            const charData = PROBES_DB[characterName];
            if (charData && charData.approvedProbeId !== undefined) {
                return charData.approvedProbeId;
            }
            return null;
        }

        // Получить данные утверждённой пробы (актёра)
        function getApprovedProbeData(characterName) {
            const charData = PROBES_DB[characterName];
            if (!charData || !charData.probes) return null;
            const approvedId = getApprovedProbeId(characterName);
            if (approvedId === null) return null;
            
            for (let idx = 0; idx < charData.probes.length; idx++) {
                const probe = charData.probes[idx];
                if (probe.id !== undefined && approvedId === probe.id) return { character: characterName, probe, series: charData.series };
                if (typeof approvedId === 'number' && approvedId === idx) return { character: characterName, probe, series: charData.series };
            }
            return null;
        }

        // Проверить, является ли проба утверждённой
        function isProbeApproved(characterName, probeIndex, probeId) {
            const approvedId = getApprovedProbeId(characterName);
            if (approvedId === null) return false;
            if (probeId !== undefined && approvedId === probeId) return true;
            if (typeof approvedId === 'number' && approvedId === probeIndex) return true;
            return false;
        }

        // Обновить SERIES_DATA из PROBES_DB
        function rebuildSeriesData() {
            // Очищаем
            SERIES_DATA = [
                { number: 1, characters: [] },
                { number: 2, characters: [] },
                { number: 3, characters: [] },
                { number: 4, characters: [] }
            ];
            
            for (const [charName, charData] of Object.entries(PROBES_DB)) {
                const seriesNum = charData.series;
                if (seriesNum >= 1 && seriesNum <= 4) {
                    SERIES_DATA[seriesNum - 1].characters.push(charName);
                }
            }
        }

        // Отрисовка блока утверждённых
        function renderApproved() {
            const container = document.getElementById('approvedListContainer');
            const approvedItems = [];
            
            for (const [charName] of Object.entries(PROBES_DB)) {
                const approvedData = getApprovedProbeData(charName);
                if (approvedData) {
                    approvedItems.push(approvedData);
                }
            }
            
            if (approvedItems.length === 0) {
                container.innerHTML = '<div class="empty-approved">✨ Пока нет утверждённых актёров</div>';
                return;
            }
            
            let html = '<div class="approved-grid">';
            for (const item of approvedItems) {
                html += `
                    <div class="approved-item" data-char="${escapeHtml(item.character)}">
                        <span class="approved-badge-icon">✅</span>
                        <div>
                            <div class="approved-char-name">${escapeHtml(item.character)}</div>
                            <div class="approved-actor-name">${escapeHtml(item.probe.name)}</div>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML = html;
            
            // Обработчики клика по утверждённым
            document.querySelectorAll('.approved-item').forEach(el => {
                el.addEventListener('click', () => {
                    const charName = el.getAttribute('data-char');
                    openProbeModal(charName);
                });
            });
        }

        // Отрисовка сетки серий
        function renderSeries() {
            rebuildSeriesData();
            const container = document.getElementById('seriesContainer');
            let html = `<div class="series-grid">`;
            for (const series of SERIES_DATA) {
                const chars = series.characters;
                html += `
                    <div class="series-card">
                        <div class="card-header">
                            <div class="series-number">
                                🎞️ Серия ${series.number}
                                <span class="badge-count">${chars.length} перс.</span>
                            </div>
                        </div>
                        <div class="characters-list">
                            <div class="character-items">
                `;
                if (chars.length === 0) {
                    html += `<div class="empty-message">✨ Персонажи скоро появятся</div>`;
                } else {
                    for (const ch of chars) {
                        const hasApproved = getApprovedProbeId(ch) !== null;
                        const approvedBadge = hasApproved ? `<span class="has-approved-badge">✅</span>` : '';
                        html += `<li class="character-item" data-char="${escapeHtml(ch)}">${escapeHtml(ch)}${approvedBadge}</li>`;
                    }
                }
                html += `</div></div></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;

            // Навешиваем обработчики на все имена персонажей
            document.querySelectorAll('.character-item').forEach(el => {
                el.addEventListener('click', () => {
                    const charName = el.getAttribute('data-char');
                    openProbeModal(charName);
                });
            });
        }

        // Открытие модального окна с пробами для выбранного персонажа
        function openProbeModal(characterName) {
            const modal = document.getElementById('probeModal');
            const modalTitle = document.getElementById('modalCharTitle');
            const probesContainer = document.getElementById('probesListContainer');
            modalTitle.textContent = `🎭 ${characterName}`;
            const characterProbes = PROBES_DB[characterName];
            if (!characterProbes || !characterProbes.probes || characterProbes.probes.length === 0) {
                probesContainer.innerHTML = `<div class="probe-card" style="justify-content:center;">📹 Пробы для этого персонажа скоро появятся.</div>`;
                modal.classList.add('active');
                return;
            }
            let html = '';
            for (let idx = 0; idx < characterProbes.probes.length; idx++) {
                const probe = characterProbes.probes[idx];
                const photoPath = probe.photo && probe.photo.trim() !== "" ? probe.photo : "https://via.placeholder.com/200x200?text=Нет+фото";
                const detailsHtml = probe.details ? `<div class="probe-details">${escapeHtml(probe.details)}</div>` : '';
                const extraHtml = probe.extra ? `<div class="probe-desc">${escapeHtml(probe.extra)}</div>` : '';
                const isApproved = isProbeApproved(characterName, idx, probe.id);
                const approvedClass = isApproved ? 'approved-card' : '';
                const approvedMark = isApproved ? '<span class="approved-tag">✅ Утверждён</span>' : '';
                html += `
                    <div class="probe-card ${approvedClass}">
                        <div class="probe-photo">
                            <img src="${escapeHtml(photoPath)}" alt="${escapeHtml(probe.name)}" class="probe-img" data-photo="${escapeHtml(photoPath)}">
                        </div>
                        <div class="probe-info">
                            <div class="probe-name">${escapeHtml(probe.name)} ${approvedMark}</div>
                            ${detailsHtml}
                            ${extraHtml}
                            <button class="watch-video-btn" data-video="${escapeHtml(probe.videoUrl)}">🎥 Смотреть видео</button>
                        </div>
                    </div>
                `;
            }
            probesContainer.innerHTML = html;
            // Обработчики для увеличения фото
            document.querySelectorAll('.probe-img').forEach(img => {
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const photoUrl = img.getAttribute('data-photo');
                    if (photoUrl) openImageModal(photoUrl);
                });
            });
            // Обработчики для кнопок видео
            document.querySelectorAll('.watch-video-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const videoUrl = btn.getAttribute('data-video');
                    if (videoUrl && videoUrl.trim()) {
                        openVideoModal(videoUrl);
                    } else {
                        alert('Ссылка на видео отсутствует');
                    }
                });
            });
            modal.classList.add('active');
        }

        // Открытие увеличенного фото
        function openImageModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const fullImg = document.getElementById('fullscreenImage');
            fullImg.src = imgSrc;
            modal.classList.add('active');
        }

        // Открытие видео в модальном окне
        function openVideoModal(videoUrl) {
            const modal = document.getElementById('videoModal');
            const container = document.getElementById('videoIframeContainer');
            let embedUrl = videoUrl;
            if (videoUrl.includes('youtube.com/watch?v=')) {
                embedUrl = videoUrl.replace('watch?v=', 'embed/');
            } else if (videoUrl.includes('youtu.be/')) {
                const videoId = videoUrl.split('/').pop();
                embedUrl = `https://www.youtube.com/embed/${videoId}`;
            }
            container.innerHTML = `<iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe>`;
            modal.classList.add('active');
        }

        // Закрытие всех модальных окон
        document.getElementById('closeProbeModal').addEventListener('click', () => {
            document.getElementById('probeModal').classList.remove('active');
        });
        document.getElementById('closeImageBtn').addEventListener('click', () => {
            document.getElementById('imageModal').classList.remove('active');
        });
        document.getElementById('closeVideoBtn').addEventListener('click', () => {
            document.getElementById('videoModal').classList.remove('active');
            document.getElementById('videoIframeContainer').innerHTML = '';
        });
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('imageModal')) {
                document.getElementById('imageModal').classList.remove('active');
            }
            if (e.target === document.getElementById('videoModal')) {
                document.getElementById('videoModal').classList.remove('active');
                document.getElementById('videoIframeContainer').innerHTML = '';
            }
            if (e.target === document.getElementById('probeModal')) {
                document.getElementById('probeModal').classList.remove('active');
            }
        });

        // Переключение светлой/тёмной темы
        const themeSwitcher = document.getElementById('themeSwitcher');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        function setTheme(theme) {
            document.body.classList.remove('light', 'dark');
            document.body.classList.add(theme);
            if (theme === 'light') {
                themeIcon.textContent = '🌞';
                themeText.textContent = 'Светлая тема';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Тёмная тема';
            }
            localStorage.setItem('theme', theme);
        }
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme && (savedTheme === 'light' || savedTheme === 'dark')) {
            setTheme(savedTheme);
        } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(prefersDark ? 'dark' : 'light');
        }
        themeSwitcher.addEventListener('click', () => {
            const currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
            setTheme(currentTheme === 'light' ? 'dark' : 'light');
        });
